
name: Build FFmpeg Windows Nonfree

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 Nonfree
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: ./util/free_disk_space.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          GITHUB_REPOSITORY=btbn/ffmpeg-builds ./makeimage.sh win64 nonfree

      - name: Compile FFmpeg
        run: |
          GITHUB_REPOSITORY=btbn/ffmpeg-builds ./build.sh win64 nonfree

      - name: Upload FFmpeg ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-nonfree
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
